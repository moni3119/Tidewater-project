apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: settle-api
  namespace: tidewater
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: settle-api

  minReplicas: 2
  maxReplicas: 10

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 0

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
