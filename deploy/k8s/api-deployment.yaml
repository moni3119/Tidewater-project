apiVersion: apps/v1
kind: Deployment
metadata:
  name: settle-api
  namespace: tidewater
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settle-api
  template:
    metadata:
      labels:
        app: settle-api
    spec:
      containers:
        - name: settle-api
          image: settle-api:1.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql://settle:settle_dev_password@postgres:5432/settle"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
