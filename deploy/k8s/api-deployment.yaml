apiVersion: apps/v1
kind: Deployment
metadata:
  name: settle-api
  namespace: tidewater
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settle-api
  template:
    metadata:
      labels:
        app: settle-api
    spec:
      containers:
        - name: settle-api
          image: settle-api:task-e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidewater-db-secret
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "postgresql://settle:$(POSTGRES_PASSWORD)@postgres:5432/settle"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
