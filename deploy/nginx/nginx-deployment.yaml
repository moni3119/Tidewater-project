apiVersion: apps/v1
kind: Deployment
metadata:
  name: tidewater-nginx
  namespace: tidewater
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tidewater-nginx
  template:
    metadata:
      labels:
        app: tidewater-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: tidewater-nginx-config
