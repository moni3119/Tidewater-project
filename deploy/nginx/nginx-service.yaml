apiVersion: v1
kind: ConfigMap
metadata:
  name: tidewater-nginx-config
  namespace: tidewater
data:
  nginx.conf: |
    events {}

    http {
        upstream settle_api {
            server settle-api:8000;
        }

        server {
            listen 80;

            location / {
                proxy_pass http://settle_api;
                proxy_connect_timeout 5s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;

                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: tidewater-nginx
  namespace: tidewater
spec:
  selector:
    app: tidewater-nginx
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
