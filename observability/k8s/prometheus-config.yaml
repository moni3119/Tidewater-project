apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tidewater
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: "tidewater-api"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "settle-api:8000"

      - job_name: "tidewater-worker"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "settle-worker-metrics:8001"

      - job_name: "postgres"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "postgres-exporter:9187"

  alerts.yml: |
    groups:
      - name: tidewater-alerts
        rules:

          - alert: APIHighErrorRate
            expr: |
              (
                sum(rate(tidewater_http_requests_total{
                  status=~"5..",
                  path=~"/settlements.*"
                }[5m]))
                /
                sum(rate(tidewater_http_requests_total{
                  path=~"/settlements.*"
                }[5m]))
              ) > 0.01
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Settlement API error rate is above 1%"
              runbook: "docs/RUNBOOK.md"

          - alert: APIHighLatency
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(tidewater_http_request_duration_seconds_bucket{
                  path=~"/settlements.*"
                }[5m])) by (le)
              ) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Settlement API p95 latency is above 500ms"
              runbook: "docs/RUNBOOK.md"

          - alert: WorkerFailures
            expr: |
              increase(tidewater_worker_messages_failed_total[5m]) > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Worker message failures detected"
              runbook: "docs/RUNBOOK.md"

          - alert: SettlementFreshnessHigh
            expr: |
              tidewater_settlement_pending_age_seconds > 300
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "A settlement has been pending for more than 5 minutes"
              runbook: "docs/RUNBOOK.md"
          - alert: PostgresConnectionsHigh
            expr: |
              pg_stat_activity_count
              /
              pg_settings_max_connections > 0.80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL connections exceed 80%"
              runbook: "docs/RUNBOOK.md"
